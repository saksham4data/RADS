# ─────────────────────────────────────────────────────────────
# RADS baseline — P02 ResNet18 + GRU binary clip classifier
# ─────────────────────────────────────────────────────────────
# 500 PICEK clips (250 accident + 250 paired pre-accident normal),
# 350 train / 76 val / 74 test, no source-video overlap across splits.
# Frozen reference for comparison with the object-centric pipeline.
# ─────────────────────────────────────────────────────────────

project:
  name: "RADS"
  training_version: "1.0.0"

experiment:
  id: "P02"
  name: "P02 PICEK Binary Temporal GRU (500 clips, balanced)"

# ── Data ────────────────────────────────────────────────────
data:
  metadata_path: "data/splits/p02_binary.csv"
  dataset_name: "picek_p02"
  raw_base_dir: "data"
  label_column: "type"
  label_mode: "binary"
  split_column: "split_in_distribution"
  class_mapping:
    normal: 0
    accident: 1

  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15

  frame_sampling:
    strategy: "uniform"
    frames_per_video: 8

  image_size: [224, 224]

  augmentation:
    enabled: true
    preset: "conservative_v1"
    horizontal_flip:
      enabled: true
      p: 0.5
    rotation:
      enabled: true
      degrees: 5
    brightness_contrast:
      enabled: true
      brightness: 0.15
      contrast: 0.15
    saturation:
      enabled: false
      value: 0.0
    hue:
      enabled: false
      value: 0.0
    gaussian_blur:
      enabled: false
      kernel_size: 3
      sigma: [0.1, 0.5]

# ── Model ───────────────────────────────────────────────────
model:
  name: "resnet18"
  pretrained: true
  num_classes: 2
  freeze_backbone: true

# ── Temporal ────────────────────────────────────────────────
temporal:
  enabled: true
  architecture: "gru"
  hidden_dim: 128
  num_layers: 1
  dropout: 0.0
  bidirectional: false
  classifier_dropout: 0.5

# ── Training ────────────────────────────────────────────────
training:
  epochs: 50
  batch_size: 16
  num_workers: 0
  pin_memory: false
  mixed_precision: false

# ── Optimizer ───────────────────────────────────────────────
optimizer:
  name: "adam"
  lr: 0.0001
  weight_decay: 0.0001

# ── Scheduler ───────────────────────────────────────────────
scheduler:
  name: "cosine"

# ── Checkpointing ───────────────────────────────────────────
checkpoint:
  save_best: true
  save_last: true
  monitor_metric: "val/f1_accident"
  mode: "max"

# ── Early Stopping ──────────────────────────────────────────
early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.001
  mode: "max"

# ── Logging ─────────────────────────────────────────────────
logging:
  tensorboard: false
  csv: true
  log_every_n_steps: 5

# ── Weights & Biases ────────────────────────────────────────
wandb:
  project: "RADS"
  entity: null
  job_type: "training"
  group: "picek-small-binary-temporal"
  tags: ["picek", "p02", "500_subset", "binary", "temporal", "gru"]
  enabled: true
  log_model: false

# ── Reproducibility ─────────────────────────────────────────
reproducibility:
  seed: 42

# ── Output ──────────────────────────────────────────────────
output:
  timestamped: true
  maintain_latest: true
  track_run_history: true
  generate_manifest: true
