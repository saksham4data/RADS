# ─────────────────────────────────────────────────────────────
# RADS Training Module — Frozen Reference: Experiment T01
# ─────────────────────────────────────────────────────────────
# Immutable reference configuration for T01 Temporal Proof-of-Concept.
#
# Experiment ID: T01
# W&B Run ID: q8o10v54
# W&B Run URL: https://wandb.ai/saksham4data-vinkura/RADS/runs/q8o10v54
# Checkpoint Output Dir: training/outputs/2026-08-24_20-12-10
# Evaluation Output Dir: training/outputs/2026-08-25_20-35-54
# Best Checkpoint: checkpoints/best.pt (Epoch 1 / index 0)
# Monitored Metric: val/f1_accident = 0.631578947368421
# Test Results: Test Acc = 46.67%, Test Recall (Accident) = 100%, Test F1 (Accident) = 0.6364
# Git Commit: fe1a7f22bc27cac2c430d7f07ae3facd9c09778c
# ─────────────────────────────────────────────────────────────

project:
  name: "RADS"
  training_version: "1.0.0"

experiment:
  id: "T01"
  name: "T01 Temporal GRU on TUDAT v2 (controlled comparison vs E07)"

# ── Data ────────────────────────────────────────────────────
data:
  metadata_path: "Datasets/processed/tudat/v2/global_master_metadata_v2.csv"
  dataset_name: "tudat"
  raw_base_dir: "Datasets/raw"
  label_column: "type"
  label_mode: "binary"
  split_column: "split_in_distribution"
  class_mapping: null

  split_ratios:
    train: 0.70
    val: 0.14
    test: 0.16

  frame_sampling:
    strategy: "uniform"
    frames_per_video: 8

  image_size: [224, 224]

  augmentation:
    enabled: true
    preset: "conservative_v1"
    horizontal_flip:
      enabled: true
      p: 0.5
    rotation:
      enabled: true
      degrees: 5
    brightness_contrast:
      enabled: true
      brightness: 0.15
      contrast: 0.15
    saturation:
      enabled: false
      value: 0.0
    hue:
      enabled: false
      value: 0.0
    gaussian_blur:
      enabled: false
      kernel_size: 3
      sigma: [0.1, 0.5]

# ── Model ───────────────────────────────────────────────────
model:
  name: "resnet18"
  pretrained: true
  num_classes: 2
  freeze_backbone: false

# ── Temporal ────────────────────────────────────────────────
temporal:
  enabled: true
  architecture: "gru"
  hidden_dim: 256
  num_layers: 1
  dropout: 0.0
  bidirectional: false
  classifier_dropout: 0.3

# ── Training ────────────────────────────────────────────────
training:
  epochs: 50
  batch_size: 32
  num_workers: 0
  pin_memory: false
  mixed_precision: false

# ── Optimizer ───────────────────────────────────────────────
optimizer:
  name: "adam"
  lr: 0.001
  weight_decay: 0.0001

# ── Scheduler ───────────────────────────────────────────────
scheduler:
  name: "step_lr"
  step_size: 5
  gamma: 0.1

# ── Checkpoint ──────────────────────────────────────────────
checkpoint:
  save_best: true
  save_last: true
  monitor_metric: "val/f1_accident"
  mode: "max"

# ── Early Stopping ──────────────────────────────────────────
early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.001
  mode: "max"

# ── W&B ─────────────────────────────────────────────────────
wandb:
  project: "RADS"
  entity: null
  job_type: "training"
  group: "temporal-modeling"
  tags: ["pipeline-5", "temporal", "gru", "resnet18", "tudat", "tudat-v2", "experiment-T01", "frozen-reference"]

# ── Reproducibility ─────────────────────────────────────────
reproducibility:
  seed: 42

# ── Output ──────────────────────────────────────────────────
output:
  timestamped: true
  maintain_latest: true
  track_run_history: true
  generate_manifest: true
