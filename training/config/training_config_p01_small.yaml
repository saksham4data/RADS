# ─────────────────────────────────────────────────────────────
# RADS Training Module — Small PICEK Binary Temporal Experiment P01
# ─────────────────────────────────────────────────────────────
# Binary accident vs non-accident temporal classification on the
# controlled Small PICEK dataset (200 clips: 100 pos + 100 neg).
#
# Objectives:
#   - Validate temporal GRU architecture on balanced binary collision detection
#   - 200 balanced clips (100 real positive + 100 paired pre-accident negative)
#   - 70 train (140 clips) / 15 val (30 clips) / 15 test (30 clips) stratified split
#   - Strict zero source-video leakage across splits
#   - Reuses validated ResNet18 + GRU temporal architecture from T01
# ─────────────────────────────────────────────────────────────

project:
  name: "RADS"
  training_version: "1.0.0"

experiment:
  id: "P01"
  name: "P01 Small PICEK Binary Temporal GRU (200 clips, balanced)"

# ── Data ────────────────────────────────────────────────────
data:
  metadata_path: "Datasets/processed/picek/p01_small_binary/picek_p01_small_binary_metadata.csv"
  dataset_name: "picek_p01"
  raw_base_dir: "Datasets"
  label_column: "type"
  label_mode: "binary"
  split_column: "split_in_distribution"
  class_mapping:
    normal: 0
    accident: 1

  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15

  frame_sampling:
    strategy: "uniform"
    frames_per_video: 8

  image_size: [224, 224]

  augmentation:
    enabled: true
    preset: "conservative_v1"
    horizontal_flip:
      enabled: true
      p: 0.5
    rotation:
      enabled: true
      degrees: 5
    brightness_contrast:
      enabled: true
      brightness: 0.15
      contrast: 0.15
    saturation:
      enabled: false
      value: 0.0
    hue:
      enabled: false
      value: 0.0
    gaussian_blur:
      enabled: false
      kernel_size: 3
      sigma: [0.1, 0.5]

# ── Model ───────────────────────────────────────────────────
model:
  name: "resnet18"
  pretrained: true
  num_classes: 2
  freeze_backbone: false

# ── Temporal ────────────────────────────────────────────────
temporal:
  enabled: true
  architecture: "gru"
  hidden_dim: 256
  num_layers: 1
  dropout: 0.0
  bidirectional: false
  classifier_dropout: 0.3

# ── Training ────────────────────────────────────────────────
training:
  epochs: 50
  batch_size: 16
  num_workers: 0
  pin_memory: false
  mixed_precision: false

# ── Optimizer ───────────────────────────────────────────────
optimizer:
  name: "adam"
  lr: 0.001
  weight_decay: 0.0001

# ── Scheduler ───────────────────────────────────────────────
scheduler:
  name: "step_lr"
  step_size: 5
  gamma: 0.1

# ── Checkpointing ───────────────────────────────────────────
checkpoint:
  save_best: true
  save_last: true
  monitor_metric: "val/f1_accident"
  mode: "max"

# ── Early Stopping ──────────────────────────────────────────
early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.001

# ── Logging ─────────────────────────────────────────────────
logging:
  tensorboard: false
  csv: true
  log_every_n_steps: 5

# ── Weights & Biases ────────────────────────────────────────
wandb:
  project: "RADS"
  entity: null
  job_type: "training"
  group: "picek-small-binary-temporal"
  tags: ["picek", "small_subset", "binary", "temporal", "gru", "p01"]
  enabled: true
  log_model: false

# ── Reproducibility ─────────────────────────────────────────
reproducibility:
  seed: 42

# ── Output ──────────────────────────────────────────────────
output:
  timestamped: true
  maintain_latest: true
  track_run_history: true
  generate_manifest: true
